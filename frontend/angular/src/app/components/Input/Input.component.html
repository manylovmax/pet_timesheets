<div class="flex flex-col">
  <label
    class="pl-2" 
    [for]="id">{{ label() || '' }}</label>
  <input 
    class="bg-white rounded-2xl px-2"
    [id]="id"
    [type]="type()"
    [value]="value()"
    (input)="onInput($event)"
  >
  @if(errorMessage()) {
  <div class="text-red-400 px-2">{{ errorMessage() }}</div>
  }
</div>
