<MainLayout>
  <div class="flex flex-col gap-8">
    <div class="flex place-items-end gap-4">
     <div class="text-2xl">Projects</div>
      <a 
        class="underline"
        [routerLink]="['/project-create']">
        Create
      </a>
    </div>
    <ProjectsTableComponent 
      [columns]="columns"
      openObjectPageColumnAttribute="title"
      [rows]="mappedProjects()"
      [deleteButton]="true"
      [updateButton]="true"
      (update)="goToUpdatePage($event)"
      (delete)="deleteProject($event)"
      (open)="goToProject($event)"
    />
  </div>
</MainLayout>
