<MainLayout>
  <div class="flex flex-col gap-4">
    <div class="flex place-items-end gap-4">
      <div>Project</div>
      <div class="flex place-items-end gap-4">
        <div class="text-2xl">{{ title() }}</div>
        <div>({{ code()}})</div>
      </div>
    </div>
    <div >{{ description() }}</div>
    <a 
      class="underline"
      [routerLink]="['/project/' + id + '/create-task']">
      Create task
    </a>
    <div>Tasks</div>
    <TasksTableComponent 
      [columns]="columns"
      [rows]="mappedTasks()"
      [deleteButton]="true"
      [updateButton]="true"
      (update)="goToUpdateTaskPage($event)"
      (delete)="deleteTask($event)"
      (open)="goToTask($event)"
    />
  </div>
</MainLayout>
