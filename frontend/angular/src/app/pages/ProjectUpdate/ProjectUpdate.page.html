<MainLayout>
  <div class="grid place-items-center h-screen">
    <div class="bg-gray-200 rounded-2xl p-4 flex flex-col gap-4 items-center">
      <div>Update project</div>
      <InputComponent 
        type="text"
        label="Title"
        [(value)]="title"
      />
      <InputComponent 
        type="text"
        label="Code"
        [(value)]="code"
      />
      <TextareaComponent 
        label="Description"
        [(value)]="description"
      />
      <div class="flex gap-4 justify-between w-full">
        <a 
          class="underline"
          [routerLink]="['/projects']">
          To projects
        </a>
        <button 
          class="cursor-pointer underline"
          (click)="onUpdate()"
        >Update</button>
      </div>
    </div>
  </div>
</MainLayout>
